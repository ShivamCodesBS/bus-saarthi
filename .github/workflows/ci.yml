name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  FLUTTER_VERSION: '3.24.0'

jobs:
  # Backend Tests & Build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bus_saarthi_test
          JWT_SECRET: test-secret-key-for-testing-only
          WEBHOOK_SECRET: test-webhook-secret

      - name: Build backend
        run: npm run build

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 7

  # Frontend (User) Tests & Build
  frontend-user:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --run
        env:
          VITE_API_URL: http://localhost:5000

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.bussaarthi.com

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-user-dist
          path: frontend/dist
          retention-days: 7

  # Admin Frontend Tests & Build
  frontend-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --run
        env:
          VITE_API_URL: http://localhost:5000

      - name: Build admin frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.bussaarthi.com

      - name: Upload admin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-admin-dist
          path: admin-frontend/dist
          retention-days: 7

  # Flutter Student/Parent App Tests & Build
  flutter-student:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./bus_saarthi_app

      - name: Run unit tests
        run: flutter test
        working-directory: ./bus_saarthi_app

      - name: Build APK
        run: flutter build apk --release
          --dart-define=API_URL=https://api.bussaarthi.com
          --dart-define=SOCKET_URL=https://api.bussaarthi.com
        working-directory: ./bus_saarthi_app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-student-apk
          path: bus_saarthi_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # Flutter Sensor App (Bus Device) Tests & Build
  flutter-sensor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./mobile

      - name: Run unit tests
        run: flutter test
        working-directory: ./mobile

      - name: Build APK (Driver mode)
        run: flutter build apk --release
          --dart-define=API_URL=https://api.bussaarthi.com
          --dart-define=SOCKET_URL=https://api.bussaarthi.com
          --dart-define=APP_MODE=driver
        working-directory: ./mobile

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-sensor-driver-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Build APK (BusDevice mode)
        run: flutter build apk --release
          --dart-define=API_URL=https://api.bussaarthi.com
          --dart-define=SOCKET_URL=https://api.bussaarthi.com
          --dart-define=APP_MODE=busDevice
          --dart-define=HARDWARE_TOKEN=${{ secrets.HARDWARE_TOKEN }}
          --dart-define=ROUTE_ID=4
        working-directory: ./mobile

      - name: Upload BusDevice APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-sensor-busdevice-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # Docker Build & Push
  docker:
    needs: [backend, frontend-user, frontend-admin]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bus-saarthi-backend:latest,${{ secrets.DOCKERHUB_USERNAME }}/bus-saarthi-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend (User)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bus-saarthi-frontend:latest,${{ secrets.DOCKERHUB_USERNAME }}/bus-saarthi-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend (Admin)
        uses: docker/build-push-action@v5
        with:
          context: ./admin-frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bus-saarthi-admin:latest,${{ secrets.DOCKERHUB_USERNAME }}/bus-saarthi-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Render (Backend)
  deploy-backend:
    needs: [backend, docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render
        uses: render/actions/deploy@v1
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-completion: true

  # Deploy to Vercel (Frontend User)
  deploy-frontend-user:
    needs: [frontend-user, docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          vercel-args: '--prod'
          working-directory: ./frontend

  # Deploy to Vercel (Admin Frontend)
  deploy-frontend-admin:
    needs: [frontend-admin, docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          vercel-args: '--prod'
          working-directory: ./admin-frontend

  # Notify on failure
  notify-failure:
    needs: [backend, frontend-user, frontend-admin, flutter-student, flutter-sensor, docker]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "Build failed! Check GitHub Actions for details."
          # Add Slack/Discord/Email notification here
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
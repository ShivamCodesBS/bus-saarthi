name: bus_sensor_app
description: "Bus Saarthi — Smart Bus Attendance & Tracking App"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & Backend
  socket_io_client: ^3.0.0
  dio: ^5.8.0+1
  
  # Sensors (GPS, Accelerometer, Compass)
  geolocator: ^13.0.1
  sensors_plus: ^6.1.0
  flutter_compass: ^0.8.0
  
  # Camera
  camera: ^0.11.1
  image: ^4.5.4

  # Face Recognition — ArcFace (on-device)
  google_mlkit_face_detection: ^0.12.0
  tflite_flutter: ^0.11.0

  # State Management
  provider: ^6.1.2
  
  # Local Storage
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  
  # Background Processing
  workmanager: ^0.9.0
  flutter_background_service: 5.1.0
  flutter_local_notifications: ^17.1.2

  # Utilities
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.4
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  geocoding: ^4.0.0
  audioplayers: ^6.7.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/mobilefacenet.tflite
    - assets/sounds/

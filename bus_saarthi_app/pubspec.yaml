name: bus_saarthi_app
description: "Bus Saarthi — Smart Bus Management System (Student & Parent app)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  provider: ^6.1.5+1
  socket_io_client: ^3.1.6
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  cached_network_image: ^4.0.5
  intl: ^0.20.3
  video_player: ^2.14.1
  connectivity_plus: ^7.3.2
  geolocator: ^14.0.1
  permission_handler: ^13.0.2
  audioplayers: ^6.8.1
  url_launcher: ^6.3.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  image_picker: ^1.2.4
  file_selector: ^1.1.0
  fl_chart: ^1.3.0
  lucide_icons_flutter: ^4.0.1
  flutter_map_cache: ^2.1.0
  http_cache_file_store: ^2.0.2
  path_provider: ^2.1.6
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/videos/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/GeistVariable.ttf
